schema_version: 1

context:
  version: "0.4.1"

package:
  name: strsimpy
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/strsimpy/strsimpy-${{ version }}.tar.gz
  sha256: f6a96d128ca10e1eb107b2506d128f5a4c42f087d97c7720aedd4c772262be12

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin
  host:
    - python
    - pip
    - maturin >=1,<2
  run:
    - python

tests:
  - python:
      imports:
        - strsimpy
      pip_check: true

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Python3.x implementation of tdebatty/java-string-similarity
  description: A library implementing different string similarity and distance measures.
  homepage: https://github.com/luozhouyang/python-string-similarity
  repository: https://github.com/luozhouyang/python-string-similarity
  documentation: https://github.com/luozhouyang/python-string-similarity

extra:
  recipe-maintainers:
    - aschonfeld
    - jsmolic
