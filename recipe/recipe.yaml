schema_version: 1

context:
  version: "0.4.1"

package:
  name: strsimpy
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/strsimpy/strsimpy-${{ version }}.tar.gz
  sha256: f6a96d128ca10e1eb107b2506d128f5a4c42f087d97c7720aedd4c772262be12

build:
  number: 0
  python:
    version_independent: true
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - maturin
  host:
    - python ${{ python_min }}.*
    - python-abi3
    - pip
    - maturin >=1,<2
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strsimpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - abi3audit
        - python ${{ python_min }}.*
    script:
      - if: unix
        then: abi3audit $SP_DIR/strsimpy/_strsimpy.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
        else: abi3audit %SP_DIR%/strsimpy/_strsimpy.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Python3.x implementation of tdebatty/java-string-similarity
  description: A library implementing different string similarity and distance measures.
  homepage: https://github.com/luozhouyang/python-string-similarity
  repository: https://github.com/luozhouyang/python-string-similarity
  documentation: https://github.com/luozhouyang/python-string-similarity

extra:
  recipe-maintainers:
    - aschonfeld
    - jsmolic
