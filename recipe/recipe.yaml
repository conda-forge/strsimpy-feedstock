schema_version: 1

context:
  version: "0.3.0"

package:
  name: strsimpy
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/s/strsimpy/strsimpy-${{ version }}.tar.gz
    sha256: ba1128dfaef6c85398576ad0f576b4eb2b78e9e707a713e228b32532aabc2c39

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - strsimpy
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Python3.x implementation of tdebatty/java-string-similarity
  description: A library implementing different string similarity and distance measures.
  homepage: https://github.com/luozhouyang/python-string-similarity
  repository: https://github.com/luozhouyang/python-string-similarity
  documentation: https://github.com/luozhouyang/python-string-similarity

extra:
  recipe-maintainers:
    - aschonfeld
    - jsmolic
